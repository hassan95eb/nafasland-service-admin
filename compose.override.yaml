services:
  mssql:
    ports:
      - "1433:1433"

  api:
    build:
      target: build
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    command: ["dotnet", "watch", "run", "--no-launch-profile", "--project", "src/Api/NafasLand.Admin.Api.csproj"]
    volumes:
      - ./src:/src/src
      - api-logs:/app/logs
      # Each project's obj/bin is deliberately shadowed; the container (root)
      # and the host write two separate sets of artifacts, otherwise
      # root-owned files are left on the host and break the next host build.
      - api-obj:/src/src/Api/obj
      - api-bin:/src/src/Api/bin
      - kernel-obj:/src/src/Shared/Kernel/obj
      - kernel-bin:/src/src/Shared/Kernel/bin
      - infrastructure-obj:/src/src/Shared/Infrastructure/obj
      - infrastructure-bin:/src/src/Shared/Infrastructure/bin
      - sample-obj:/src/src/Modules/Sample/obj
      - sample-bin:/src/src/Modules/Sample/bin
      - identity-obj:/src/src/Modules/Identity/obj
      - identity-bin:/src/src/Modules/Identity/bin
      - auditing-obj:/src/src/Modules/Auditing/obj
      - auditing-bin:/src/src/Modules/Auditing/bin

volumes:
  api-obj:
  api-bin:
  kernel-obj:
  kernel-bin:
  infrastructure-obj:
  infrastructure-bin:
  sample-obj:
  sample-bin:
  identity-obj:
  identity-bin:
  auditing-obj:
  auditing-bin:
