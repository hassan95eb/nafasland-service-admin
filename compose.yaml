name: nafasland-admin

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?رمز sa در .env تعریف نشده است}
    volumes:
      - mssql-data:/var/opt/mssql
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: ${DATABASE__CONNECTIONSTRING:?رشتهٔ اتصال در .env تعریف نشده است}
      Portal__BaseUrl: ${PORTAL__BASEURL:?آدرس پرتال در .env تعریف نشده است}
      Portal__BearerToken: ${PORTAL__BEARERTOKEN:?توکن پرتال در .env تعریف نشده است}
      Portal__TestProductId: ${PORTAL__TESTPRODUCTID:?شناسهٔ محصول تستی در .env تعریف نشده است}
      Portal__RateLimitPerSecond: ${PORTAL__RATELIMITPERSECOND:-1.5}
      Portal__RateLimitQueueCapacity: ${PORTAL__RATELIMITQUEUECAPACITY:-20}
      Portal__RateLimitQueueTimeoutSeconds: ${PORTAL__RATELIMITQUEUETIMEOUTSECONDS:-15}
      Identity__SuperAdmin__Username: ${IDENTITY__SUPERADMIN__USERNAME:?نام کاربری سوپرادمین در .env تعریف نشده است}
      Identity__SuperAdmin__Password: ${IDENTITY__SUPERADMIN__PASSWORD:?رمز اولیهٔ سوپرادمین در .env تعریف نشده است}
    volumes:
      - api-logs:/app/logs
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    environment:
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8080}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  proxy:
    image: caddy:2-alpine
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mssql-data:
  api-logs:
